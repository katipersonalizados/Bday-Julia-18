<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#fff8ef">

  <title>Júlia 18 anos | Memórias da Festa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <!-- TELA INICIAL -->
    <section class="hero">

      <!-- Elementos somente decorativos -->
      <div class="floral floral-top" aria-hidden="true"></div>
      <div class="floral floral-bottom" aria-hidden="true"></div>

      <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
      <span class="sparkle sparkle-two" aria-hidden="true">✦</span>
      <span class="sparkle sparkle-three" aria-hidden="true">✧</span>

      <div class="hero-content">

        <p class="event-date">12 • 09 • 2026</p>

        <p class="small-title">UMA TARDE PARA FLORESCER</p>

        <div class="title-wrapper">
          <span class="age-number" aria-hidden="true">18</span>
          <h1>Júlia</h1>
        </div>

        <p class="subtitle">
          Uma tarde para celebrar, registrar
          e guardar para sempre.
        </p>

        <!-- Botão para tirar ou enviar a foto -->
        <label for="photoInput" class="upload-button">
          <span class="button-icon" aria-hidden="true">📸</span>
          <span>Tirar ou enviar foto</span>
        </label>

        <!-- Não altere este campo -->
        <input
          type="file"
          id="photoInput"
          accept="image/*"
          capture="environment"
          hidden
        >

        <!-- Mensagem apresentada pelo script -->
        <p id="status" class="upload-status" aria-live="polite"></p>

        <!-- Botão para acessar as fotos -->
        <a
          href="#gallery"
          id="galleryButton"
          class="gallery-button"
        >
          <span>Ver fotos da festa</span>
          <span class="arrow" aria-hidden="true">↓</span>
        </a>

      </div>

      <div class="scroll-indicator" aria-hidden="true">
        <span>DESCUBRA AS MEMÓRIAS</span>
        <span class="scroll-line"></span>
      </div>

    </section>

    <!-- TRANSIÇÃO ENTRE AS SEÇÕES -->
    <div class="section-transition" aria-hidden="true">
      <span></span>
      <span class="transition-flower">✿</span>
      <span></span>
    </div>

    <!-- GALERIA -->
    <section id="gallery" class="gallery-section">

      <header class="gallery-header">

        <p class="small-title">MEMÓRIAS DA TARDE</p>

        <h2>Nosso álbum</h2>

        <p class="gallery-description">
          Cada foto guarda um pedacinho desta tarde especial.
        </p>

      </header>

      <!-- O script continuará colocando as fotos aqui -->
      <div id="photosGrid" class="photos-grid"></div>

      <div class="gallery-footer" aria-hidden="true">
        <span>Com carinho, Júlia</span>
        <span class="footer-heart">♡</span>
      </div>

    </section>

  </main>

  <!-- Não alterar estes scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
